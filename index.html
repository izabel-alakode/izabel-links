<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IZABEL Boutique Fashion Studio</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0a0a0a;
        min-height: 100vh;
        padding: 40px 20px;
    }
    
    .container {
        max-width: 600px;
        margin: 0 auto;
    }
    
    header {
        text-align: center;
        margin-bottom: 50px;
        animation: fadeInDown 0.8s ease-out;
    }
    
    .logo {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 3px solid #1a1a1a;
        box-shadow: 0 8px 30px rgba(255, 255, 255, 0.05);
    }
    
    h1 {
        font-size: 32px;
        color: #ffffff;
        font-weight: 300;
        letter-spacing: 4px;
        margin-bottom: 5px;
        text-transform: uppercase;
    }
    
    .tagline {
        color: #888;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        animation: fadeInUp 0.8s ease-out;
        margin-bottom: 30px;
    }
    
    .call-button {
        background: #121212;
        border-radius: 50px;
        padding: 20px 50px;
        text-decoration: none;
        color: #fff;
        transition: all 0.3s ease;
        border: 1px solid #1a1a1a;
        display: inline-flex;
        align-items: center;
        gap: 15px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 auto;
        animation: fadeInUp 1s ease-out;
    }
    
    .call-button:hover {
        background: #1a1a1a;
        transform: translateY(-2px);
        border-color: #2a2a2a;
        box-shadow: 0 8px 30px rgba(52, 168, 83, 0.2);
    }
    
    .call-button:active {
        transform: translateY(0px);
    }
    
    .call-wrapper {
        text-align: center;
        margin-top: 20px;
    }
    
    .link-card {
        background: #121212;
        border-radius: 16px;
        padding: 30px 20px;
        text-decoration: none;
        color: #fff;
        transition: all 0.3s ease;
        border: 1px solid #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 150px;
    }
    
    .link-card:hover {
        background: #1a1a1a;
        transform: translateY(-4px);
        border-color: #2a2a2a;
        box-shadow: 0 12px 40px rgba(255, 255, 255, 0.03);
    }
    
    .link-card:active {
        transform: translateY(-2px);
    }
    
    .icon-wrapper {
        width: 50px;
        height: 50px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.9;
    }
    
    .icon-wrapper svg {
        width: 100%;
        height: 100%;
    }
    
    .label {
        font-size: 12px;
        font-weight: 500;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    
    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @media (max-width: 600px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
        }
        
        h1 {
            font-size: 26px;
            letter-spacing: 3px;
        }
    }
</style>
</head>
